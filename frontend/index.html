<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Printing System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Campus Printing System</h2>
        <div id="message" style="display:none; margin-bottom: 15px; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold;"></div>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email or Roll ID</label>
                <input type="text" id="email" placeholder="Enter your email or roll ID" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
        <a href="#" class="forgot-password">Forgot Password?</a>
        <div class="divider"></div>
        <a href="register.html" class="create-account-btn">Create New Account</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
