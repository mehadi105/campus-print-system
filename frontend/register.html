<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up for Campus Printing System</title>
    <link rel="stylesheet" href="register.style.css">
</head>
<body>
    <div class="register-container">
        <h2>Create a new account</h2>
        <p class="subtitle">It's quick and easy.</p>
        <div class="divider"></div>
        <div id="message" style="display:none; margin-bottom: 15px; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold;"></div>
        <form id="registerForm">
            <div class="input-group">
                <input type="text" id="fullName" placeholder="Full name" required>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <input type="text" id="rollId" placeholder="Roll ID" required>
                </div>
                <div class="input-group">
                    <input type="text" id="department" placeholder="Department" required>
                </div>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email address" required>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <input type="text" id="session" placeholder="Session" required>
                </div>
                <div class="input-group">
                    <input type="text" id="semester" placeholder="Semester" required>
                </div>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="New password" required>
            </div>
            <button type="submit" id="signupBtn" class="signup-btn">Sign Up</button>
            <a href="index.html" class="already-account">Already have an account?</a>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
